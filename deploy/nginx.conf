# Plantilla: sustituye TU_DOMINIO y las rutas del certificado existente.
server {
    listen 80;
    server_name TU_DOMINIO;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name TU_DOMINIO;
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/nuestro-espacio/frontend/dist;
    index index.html;
    client_max_body_size 21m; # Una foto de 20 MiB más el formulario.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Private video files. This URI cannot be accessed directly by a browser.
    # Must match VIDEO_STORAGE_DIR. Grant Nginx read-only access to media/images.
    location ^~ /_private_videos/ {
        internal;
        alias /var/lib/nuestro-espacio/videos/;
        sendfile on;
        max_ranges 1;
        disable_symlinks on;
        types { video/mp4 mp4; image/webp webp; }
        default_type application/octet-stream;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/videos/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 9m;
        client_body_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s; # One-time validation/hash of large MP4 on HDD.
        proxy_send_timeout 180s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s; # Procesar una foto grande en el servidor de 2 núcleos.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # No add_header aquí: se mantienen los encabezados del servidor.
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
