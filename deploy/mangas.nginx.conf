# Optional additions INSIDE the existing Nuestro Espacio HTTPS server block.
# Keep the actual hostname, TLS, backend port and other locations unchanged.
# Use the real MANGA_STORAGE_DIR below; never expose this directory publicly.
location ^~ /_private_mangas/ {
    internal;
    alias /var/lib/nuestro-espacio/mangas/;
    sendfile on;
    max_ranges 1;
    disable_symlinks on;
    types { application/pdf pdf; image/webp webp; }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
}
location ^~ /api/mangas/ {
    # REPLACE with the existing Nuestro Espacio backend port, NOT another app's port.
    proxy_pass http://127.0.0.1:PUERTO_NUESTRO_ESPACIO;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 101m;
    client_body_timeout 180s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
